<div class="form-group">
    <div class="form-group">
        <label for="padImage" class="form-label">Scale to Fit:</label>
        <div class="toggle-container">
            <input type="checkbox" id="padImage" name="padImage" class="toggle-checkbox" value="false">
            <label for="padImage" class="toggle-label"></label>
        </div>
        <!-- Hidden input ensures 'true' is always sent when unchecked -->
        <input type="hidden" name="padImage" value="true">
    </div>

    <div class="form-group">
        <label class="form-label" for="backgroundOption">Background:</label>
        <div class="form-group">
            <input type="radio" id="backgroundOption" name="backgroundOption" value="blur">
            <label>Blur</label>
            <input type="radio" id="backgroundOption" name="backgroundOption" value="color">
            <label>Color</label>
            <input type="color" id="backgroundColor" name="backgroundColor" value="#ffffff" class="color-picker"/>
        </div>
    </div>

    <div class="form-group">
        <label for="showDateTaken" class="form-label">Show date taken:</label>
        <div class="toggle-container">
            <input type="checkbox" id="showDateTaken" name="showDateTaken" class="toggle-checkbox" value="true">
            <label for="showDateTaken" class="toggle-label"></label>
        </div>
        <!-- Hidden input ensures 'false' is always sent when unchecked -->
        <input type="hidden" name="showDateTaken" value="false">
    </div>

    <div class="form-group">
        <label for="dateFormat" class="form-label">Date format:</label>
        <select id="dateFormat" name="dateFormat" class="form-input">
            <option value="%b %d, %Y">Aug 16, 2026</option>
            <option value="%d %b %Y">16 Aug 2026</option>
            <option value="%B %d, %Y">August 16, 2026</option>
            <option value="%Y-%m-%d">2026-08-16</option>
            <option value="%m/%d/%Y">08/16/2026</option>
            <option value="%d/%m/%Y">16/08/2026</option>
        </select>
    </div>

    <div class="form-group">
        <label for="dateSize" class="form-label">Date size:</label>
        <select id="dateSize" name="dateSize" class="form-input">
            <option value="small">Small</option>
            <option value="medium" selected>Medium</option>
            <option value="large">Large</option>
        </select>
    </div>
</div>

<div class="form-group">
    <label for="url" class="form-label">Folder path:</label>
    <input type="text" id="folder_path" name="folder_path" placeholder="Type something..." required class="form-input">
</div>


<script>
    // populate form values from plugin settings
    document.addEventListener('DOMContentLoaded', () => {
        let backgroundOption = "blur"
        if (loadPluginSettings) {
            document.getElementById('folder_path').value = pluginSettings.folder_path;
            document.getElementById('showDateTaken').checked = pluginSettings.showDateTaken == 'true';
            if (pluginSettings.dateFormat) {
                document.getElementById('dateFormat').value = pluginSettings.dateFormat;
            }
            if (pluginSettings.dateSize) {
                document.getElementById('dateSize').value = pluginSettings.dateSize;
            }
            document.getElementById('padImage').checked = pluginSettings.padImage == 'false';
            document.getElementById('backgroundColor').value = pluginSettings.backgroundColor;

            backgroundOption = pluginSettings.backgroundOption;
        }
        document.querySelector(`input[name="backgroundOption"][value="${backgroundOption}"]`).checked = true;
    });
</script>
